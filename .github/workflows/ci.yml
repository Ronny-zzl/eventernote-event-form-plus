name: CI

# 推送到 main / PR 时检查。其他分支（如 Renovate）只在 PR 上检查，避免同一提交跑两次
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Node / pnpm 版本取自 mise.toml（与本地一致），安装结果由 mise-action 缓存
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # 发布用的 .user.js 必须和源码的构建结果一致（忘了重新构建就会失败）
      - run: git diff --exit-code eventernote-event-form-plus.user.js
